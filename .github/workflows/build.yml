name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Diagnose project layout
        run: |
          echo "===== 目录结构 ====="
          find . -maxdepth 3 -not -path './.git*' | head -60
          echo "===== settings.gradle 位置 ====="
          find . -name settings.gradle -not -path '*/build/*'
          echo "===== gradle wrapper ====="
          find . -name "gradle-wrapper.jar" -o -name "gradlew" | head

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || echo "SDK 目录为空"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          D=$(dirname "$(find . -name settings.gradle -not -path '*/build/*' | head -1)")
          [ -z "$D" ] && D="."
          echo "===== 工程目录: $D ====="
          cd "$D"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tail -80

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: warn
