name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK manually
        run: |
          set -e
          CMDLINE=commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          curl -sSL -o $CMDLINE https://dl.google.com/android/repository/$CMDLINE
          cd $HOME/android-sdk/cmdline-tools
          unzip -q /tmp/$CMDLINE
          rm -f /tmp/$CMDLINE
          if [ -d cmdline-tools ]; then rm -rf latest; mv cmdline-tools latest; fi
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          D=$(dirname "$(find . -name settings.gradle -not -path '*/build/*' | head -1)")
          [ -z "$D" ] && D="."
          echo "工程目录: $D"
          cd "$D"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1
          echo "gradle退出码=$?"
          echo "===== What went wrong ====="
          awk '/What went wrong:/,0' build.log | head -40
          echo "===== 所有 error 行 ====="
          grep -n -i "error:" build.log | head -40
          echo "===== Caused by ====="
          grep -A 8 "Caused by" build.log | head -50
          echo "===== 最后80行 ====="
          tail -80 build.log
          cp build.log /tmp/build.log || true
          true

      - name: Collect and push
        if: always()
        run: |
          mkdir -p /tmp/apks
          [ -f /tmp/build.log ] && cp /tmp/build.log /tmp/apks/
          find . -name "*.apk" -not -path "*/intermediates/*" -exec cp {} /tmp/apks/ \;
          echo "=== 产出文件 ==="
          ls -la /tmp/apks/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk 2>/dev/null || git checkout apk
          git rm -rf . 2>/dev/null || true
          cp /tmp/apks/* . 2>/dev/null || echo "无文件"
          git add -f * 2>/dev/null || true
          git commit -m "build output $(date +%Y%m%d-%H%M%S)" 2>/dev/null || echo "无提交"
          git push -f origin apk 2>&1 | tail -3

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '/tmp/apks/*'
          if-no-files-found: warn
