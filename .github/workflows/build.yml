name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Find project root
        id: findroot
        run: |
          if [ -f settings.gradle ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          else
            D=$(dirname "$(find . -name settings.gradle -not -path '*/build/*' | head -1)")
            echo "dir=${D:-.}" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        run: |
          cd "${{ steps.findroot.outputs.dir }}"
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
