      - name: Build Debug APK
        run: |
          D=$(dirname "$(find . -name settings.gradle -not -path '*/build/*' | head -1)")
          [ -z "$D" ] && D="."
          echo "工程目录: $D"
          cd "$D"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          gradle assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1 || echo "gradle失败，退出码=$?"
          echo "===== What went wrong ====="
          awk '/What went wrong:/,0' /tmp/build.log | head -40
          echo "===== error行 ====="
          grep -n -i "error:" /tmp/build.log | head -40
          echo "===== Caused by ====="
          grep -A 8 "Caused by" /tmp/build.log | head -60
          echo "===== 最后100行 ====="
          tail -100 /tmp/build.log
