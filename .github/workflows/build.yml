name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK manually
        run: |
          set -e
          CMDLINE=commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd /tmp
          curl -sSL -o $CMDLINE https://dl.google.com/android/repository/$CMDLINE
          cd $HOME/android-sdk/cmdline-tools
          unzip -q /tmp/$CMDLINE
          rm -f /tmp/$CMDLINE
          if [ -d cmdline-tools ]; then rm -rf latest; mv cmdline-tools latest; fi
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          sdkmanager --version || echo "sdkmanager 不可用"
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -30
          ls $ANDROID_HOME

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          D=$(dirname "$(find . -name settings.gradle -not -path '*/build/*' | head -1)")
          [ -z "$D" ] && D="."
          echo "工程目录: $D"
          cd "$D"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.builder.sdkDownload=true" >> gradle.properties
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: warn
